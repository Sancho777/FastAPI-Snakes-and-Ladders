<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Choose Players</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-green-100 to-blue-200 min-h-screen flex flex-col items-center justify-center p-4"
  >
    <!-- Game Title -->
    <h1 class="text-4xl font-bold mb-6 text-black text-center">
      Snakes and Ladders 🐍🎲
    </h1>

    <form
      action="/start"
      method="post"
      class="bg-white p-8 rounded-lg shadow-md w-full max-w-md"
    >
      <h2 class="text-2xl font-bold mb-4 text-center">🎮 Choose Players</h2>

      <label for="num_players" class="block mb-2 font-medium">
        Choose number of players:
      </label>
      <select
        name="num_players"
        id="num_players"
        class="w-full p-2 mb-4 border rounded border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      >
        {% for i in range(2, 11) %}
        <option value="{{ i }}">{{ i }}</option>
        {% endfor %}
      </select>

      <button
        type="submit"
        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded"
      >
        Start Game
      </button>
    </form>
  </body>
</html>
